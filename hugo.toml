baseURL = 'https://aiyolo.github.io/blog/'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'FixIt'

[params]
  # FixIt 主题版本
  version = "0.3.X"
  # 网站名称
  title = "我的博客"
  # 网站描述
  description = "一个分享技术、生活和思考的博客"
  # 网站关键词
  keywords = ["博客", "技术", "生活", "思考", "Hugo", "FixIt"]
  # 网站作者
  [params.author]
    name = "Your Name"
    email = "your.email@example.com"
    link = "https://github.com/aiyolo"
  # 网站语言
  languageCode = "zh-cn"
  defaultContentLanguage = "zh-cn"

  # 主题设置
  [params.theme]
    # 主题颜色
    palette = "blue"
    # 是否显示页面顶部信息
    headerTitle = "我的博客"
    # 是否显示页面底部的版权信息
    footer = "© 2024 - {year} · Powered by Hugo & FixIt"

  # 搜索设置
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false

  # 评论系统设置
  [params.page.comment]
    enable = true
    # giscus 评论系统
    [params.page.comment.giscus]
      enable = true
      repo = "aiyolo/blog"
      repoId = "" # 需要获取 GitHub 仓库 ID
      category = "Announcements"
      categoryId = "" # 需要获取 GitHub 分类 ID
      mapping = "pathname"
      strict = "0"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lang = "zh-CN"
      loading = "lazy"

  # 社交链接
  [params.social]
    GitHub = "https://github.com/aiyolo"
    Twitter = "https://twitter.com/yourusername"
    Email = "your.email@example.com"

  # 网站图标
  [params.image]
    favicon = "/favicon.ico"
    appleTouchIcon = "/apple-touch-icon.png"

# 菜单配置
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 2

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 4

# 分类和标签设置
[taxonomies]
  category = "categories"
  tag = "tags"

# 网站地图
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
